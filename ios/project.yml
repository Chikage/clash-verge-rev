name: ClashVerge
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B963P7JMRA
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VERGE_BUNDLE_ID: io.github.chikage.clashverge.ios
    VERGE_APP_GROUP: group.$(VERGE_BUNDLE_ID)
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    revision: 3d6871d5b4a5cd519adf233fbb576e0a2af71c17
targets:
  ClashVerge:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/Models.swift
      - Shared/ProfileConfiguration.swift
      - Shared/TunnelConfigurationStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERGE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clash Verge
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        TunnelBundleIdentifier: $(VERGE_BUNDLE_ID).PacketTunnel
        SharedAppGroupIdentifier: $(VERGE_APP_GROUP)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: Clash subscription import
            CFBundleURLSchemes:
              - clash
              - clash-verge
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Clash YAML configuration
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.yaml
              - public.text
    entitlements:
      path: App/ClashVerge.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - $(VERGE_APP_GROUP)
    dependencies:
      - target: PacketTunnel
      - package: Yams
      - sdk: NetworkExtension.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared/Models.swift
      - Shared/TunnelConfigurationStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERGE_BUNDLE_ID).PacketTunnel
        SWIFT_OBJC_BRIDGING_HEADER: Core/SwihomoCore.h
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: $(inherited) -lresolv
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Clash Verge VPN
        SharedAppGroupIdentifier: $(VERGE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - $(VERGE_APP_GROUP)
    dependencies:
      - framework: Vendor/MihomoCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
  ClashVergeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERGE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ClashVerge
schemes:
  ClashVerge:
    build:
      targets:
        ClashVerge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ClashVergeTests
    archive:
      config: Release
